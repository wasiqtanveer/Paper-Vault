name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values: supabase.js throws at import time without them. No network calls are made.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        # Pending the lint cleanup: src still has known errors.
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
