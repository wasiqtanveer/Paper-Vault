<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2: browsers cache favicons very aggressively; bump this when the icon changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Sets the theme before first paint so light-theme users never see a dark flash.
         Allowed by hash in the CSP (vercel.json); keep the two in sync if this changes. -->
    <script>try{var t=localStorage.getItem('pv-theme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#f5f5f5':'#0a0a0a')}catch(e){}</script>

    <title>PaperVault — Past Papers, Shared by Students</title>
    <meta name="description" content="PaperVault is a community library of past exam papers. Browse, search, and download approved papers, or upload your own to help other students." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperVault" />
    <meta property="og:title" content="PaperVault — Past Papers, Shared by Students" />
    <meta property="og:description" content="Browse, search, and download approved past exam papers, or upload your own to help other students." />
    <meta property="og:url" content="https://paper-vault-ivory.vercel.app/" />
    <meta property="og:image" content="https://paper-vault-ivory.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PaperVault: past papers, shared by students." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaperVault — Past Papers, Shared by Students" />
    <meta name="twitter:description" content="Browse, search, and download approved past exam papers, or upload your own to help other students." />
    <meta name="twitter:image" content="https://paper-vault-ivory.vercel.app/og-image.png" />

    <link rel="canonical" href="https://paper-vault-ivory.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>PaperVault needs JavaScript to browse and upload past papers. Please enable JavaScript in your browser and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
