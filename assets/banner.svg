<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="PaperVault — every past paper your university lost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0e0e16"/>
      <stop offset="100%" stop-color="#16121f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#6c5ce7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#dcd8ee" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#221d33" stroke-width="1"/>
    </pattern>
    <style>
      .h { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .b { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .m { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="930" cy="180" r="330" fill="url(#halo)"/>

  <!-- ── left column ─────────────────────────────────────────────── -->
  <g>
    <g transform="translate(64,44)">
      <rect x="0" y="0" width="34" height="34" rx="9" fill="none" stroke="#6c5ce7" stroke-width="2"/>
      <path d="M9 15 v-4 a8 8 0 0 1 16 0 v4" fill="none" stroke="#a29bfe" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="7" y="15" width="20" height="14" rx="3" fill="#6c5ce7"/>
    </g>
    <text class="h" x="112" y="72" font-size="20" fill="#a29bfe" letter-spacing="4">THE VAULT</text>

    <text class="h" x="64" y="152" font-size="72" fill="#f4f2ff" letter-spacing="-2.5">PaperVault</text>
    <text class="b" x="66" y="192" font-size="24" fill="#c9c3e8" opacity="0.9">Every past paper your university lost.</text>
    <text class="m" x="66" y="226" font-size="14" fill="#7a739c">upload &#8594; reviewed by a human &#8594; archived forever</text>

    <g class="m" font-size="12" letter-spacing="1.4">
      <rect x="64"  y="262" width="126" height="30" rx="15" fill="none" stroke="#332c4d"/>
      <text x="127" y="281" text-anchor="middle" fill="#a29bfe">MODERATED</text>
      <rect x="202" y="262" width="150" height="30" rx="15" fill="none" stroke="#332c4d"/>
      <text x="277" y="281" text-anchor="middle" fill="#a29bfe">RLS HARDENED</text>
      <rect x="364" y="262" width="132" height="30" rx="15" fill="none" stroke="#332c4d"/>
      <text x="430" y="281" text-anchor="middle" fill="#a29bfe">AUDIT LOG</text>
    </g>
  </g>

  <!-- ── right: three papers, three states ────────────────────────── -->
  <g>
    <!-- rejected, back -->
    <g transform="rotate(-14 776 192)">
      <rect x="696" y="90" width="160" height="204" rx="10" fill="url(#sheet)" opacity="0.42"/>
      <g stroke="#9a94b8" stroke-width="4" stroke-linecap="round" opacity="0.5">
        <path d="M714 126 h80"/><path d="M714 146 h116"/><path d="M714 166 h100"/><path d="M714 186 h112"/>
      </g>
      <rect x="712" y="236" width="98" height="26" rx="5" fill="none" stroke="#ff5c7a" stroke-width="2.5"/>
      <text class="m" x="761" y="254" font-size="12" fill="#ff5c7a" text-anchor="middle" letter-spacing="1.2">REJECTED</text>
    </g>

    <!-- pending, middle -->
    <g transform="rotate(-6 898 188)">
      <rect x="816" y="80" width="164" height="212" rx="10" fill="url(#sheet)" opacity="0.72"/>
      <g stroke="#8b84ab" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <path d="M834 118 h88"/><path d="M834 138 h120"/><path d="M834 158 h104"/><path d="M834 178 h122"/><path d="M834 198 h80"/>
      </g>
      <rect x="816" y="234" width="90" height="26" rx="5" fill="none" stroke="#f0a63c" stroke-width="2.5"/>
      <text class="m" x="861" y="252" font-size="12" fill="#e0952c" text-anchor="middle" letter-spacing="1.2">PENDING</text>
    </g>

    <!-- approved, front -->
    <g transform="rotate(4 990 182)">
      <rect x="932" y="66" width="176" height="226" rx="11" fill="url(#sheet)"/>
      <text class="m" x="954" y="98" font-size="11" fill="#6c5ce7" letter-spacing="1.6">DSA &#183; MID &#183; 2024</text>
      <g stroke="#7d76a0" stroke-width="4" stroke-linecap="round" opacity="0.75">
        <path d="M954 122 h96"/><path d="M954 142 h130"/><path d="M954 162 h112"/><path d="M954 182 h132"/><path d="M954 202 h88"/>
      </g>
      <rect x="952" y="234" width="112" height="30" rx="6" fill="#1faa59"/>
      <path d="M966 249 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="m" x="1022" y="254" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">APPROVED</text>
    </g>
  </g>
</svg>
